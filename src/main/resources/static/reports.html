<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <title>Reports - Fare Share</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="wrap">

<div class="card">

<h2>📊 Expense Reports</h2>

<p class="note">
Visual insights of your spending.
</p>

<!-- ========================= -->
<!-- TOTAL SUMMARY -->
<!-- ========================= -->

<div class="card-grid">

<div class="subcard">

<h4>Total Expenses</h4>

<p id="totalExpenses">
₹ 0
</p>

</div>

<div class="subcard">

<h4>Personal Expenses</h4>

<p id="personalExpenses">
₹ 0
</p>

</div>

<div class="subcard">

<h4>Group Expenses</h4>

<p id="groupExpenses">
₹ 0
</p>

</div>

</div>

<!-- ========================= -->
<!-- CATEGORY CHART -->
<!-- ========================= -->

<h3 style="margin-top:30px;">
Category Spending
</h3>

<canvas id="categoryChart"></canvas>

<!-- ========================= -->
<!-- MONTHLY CHART -->
<!-- ========================= -->

<h3 style="margin-top:30px;">
Monthly Expenses
</h3>

<canvas id="monthlyChart"></canvas>

<!-- ========================= -->
<!-- BACK -->
<!-- ========================= -->

<div style="margin-top:20px;">

<a
  href="dashboard.html"
  class="btn-outline"
>
← Back to Dashboard
</a>

</div>

</div>

</div>

<script src="reports.js"></script>

</body>

</html>
