<!DOCTYPE html>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

</head>

<body>

<div class="wrap">

  <!-- ========================= -->

  <h2>

  <p

    </a>

    <a

      class="btn-outline"

    </a>

    <a
      href="personal.html"
      class="btn-outline"
    >
      💰 Personal
    </a>

  <!-- ========================= -->

    style="margin-top:20px;"

<script src="history.js"></script>
