<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - Fare Share</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">👤</div>
      <h2 class="auth-title">
        LOGIN
      </h2>

      <p class="auth-subtitle">
        Access your Fare Share account
      </p>
      <div class="auth-form">
        <form id="loginForm">
          <input id="loginEmail" class="form-input" placeholder="Email" type="email" required>
          <input id="loginPass" class="form-input" placeholder="Password" type="password" required>
          <button class="btn" type="submit">LOGIN</button>
          <div id="loginMsg"></div>
        </form>
      </div>
      <div class="auth-links">

        <a href="forgot.html">
          Forgot password?
        </a>

        <a href="register.html">
          New user? Register
        </a>

      </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
